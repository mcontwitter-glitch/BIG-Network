<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIG Chain — Faucet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --bg0:#060606; --bg1:#0a0d0b; --panel:#0e120f; --panel2:#121712;
    --border:rgba(0,232,133,.13); --border-lit:rgba(0,232,133,.32);
    --cyan:#00e885; --cyan-dim:#0f9c63; --cyan-glow:rgba(0,232,133,.42);
    --green:#00e885; --amber:#ffc85c; --red:#ff5c6a; --ink:#e8f0eb; --dim:#8aa096;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { min-height:100vh; }
  body {
    background:
      radial-gradient(1000px 560px at 50% -12%, rgba(0,232,133,.085) 0%, rgba(6,6,6,0) 60%),
      radial-gradient(760px 760px at 92% 108%, rgba(0,232,133,.045) 0%, rgba(6,6,6,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    color:var(--ink); font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:44px 20px;
    letter-spacing:.1px;
  }
  .wrap { width:100%; max-width:480px; }
  .logo { text-align:center; margin-bottom:8px; position:relative; }
  .logo .big { font-family:'Space Grotesk',sans-serif; font-size:44px; font-weight:700; color:var(--cyan); letter-spacing:2px; text-shadow:0 0 26px var(--cyan-glow); }
  .logo .chain { font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--dim); letter-spacing:5px; text-transform:uppercase; margin-top:6px; }
  .livebadge { display:inline-flex; align-items:center; gap:7px; margin:16px auto 0; padding:6px 16px; border:1px solid var(--border-lit); border-radius:999px; color:var(--green); font-size:10px; letter-spacing:2px; text-transform:uppercase; background:rgba(0,232,133,.06); }
  .livedot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .tagline { text-align:center; color:var(--dim); font-size:13px; margin:20px 0 30px; letter-spacing:.6px; }

  .card { position:relative; background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--border); border-radius:16px; padding:26px 24px; margin-bottom:18px; box-shadow:0 18px 44px rgba(0,0,0,.4); }
  .card h2 { font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--cyan); text-transform:uppercase; letter-spacing:2px; margin-bottom:18px; font-weight:600; display:flex; align-items:center; gap:10px; }
  .card h2::before { content:''; width:16px; height:2px; background:var(--cyan); border-radius:2px; }

  input[type=text] { width:100%; padding:14px 16px; background:rgba(0,0,0,.45); border:1px solid var(--border); border-radius:12px; color:var(--ink); font-size:13.5px; font-family:'JetBrains Mono',monospace; outline:none; transition:border-color .15s, box-shadow .15s; }
  input[type=text]::placeholder { color:#51665c; }
  input[type=text]:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,232,133,.12), 0 0 18px var(--cyan-glow); }

  .btn { width:100%; margin-top:14px; padding:15px; background:var(--cyan); border:none; border-radius:12px; color:#04120a; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; cursor:pointer; transition:all .15s; box-shadow:0 10px 28px rgba(0,232,133,.22); }
  .btn:hover:not(:disabled) { background:#2cf09c; box-shadow:0 12px 32px rgba(0,232,133,.35); transform:translateY(-1px); }
  .btn:disabled { opacity:.4; cursor:wait; transform:none; }
  .btn.ghost { background:transparent; border:1px solid var(--border-lit); color:var(--cyan); box-shadow:none; }
  .btn.ghost:hover:not(:disabled) { background:rgba(0,232,133,.08); box-shadow:0 0 20px rgba(0,232,133,.15); }

  .msg { margin-top:16px; padding:14px 16px; border-radius:12px; font-size:12.5px; line-height:1.65; word-break:break-all; display:none; border-left:2px solid; }
  .msg.ok { display:block; background:rgba(0,232,133,.06); border-color:var(--green); color:var(--green); }
  .msg.err { display:block; background:rgba(255,92,106,.06); border-color:var(--red); color:var(--red); }
  .msg a { color:var(--cyan); text-decoration:none; border-bottom:1px dashed var(--cyan-dim); }

  .stats { display:flex; gap:12px; margin-bottom:18px; }
  .stat { flex:1; background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
  .stat .v { font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; color:var(--cyan); text-shadow:0 0 12px var(--cyan-glow); }
  .stat .k { font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:6px; }

  .foot { text-align:center; margin-top:26px; }
  .foot a { color:var(--dim); font-size:12px; text-decoration:none; margin:0 12px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid transparent; transition:.15s; }
  .foot a:hover { color:var(--cyan); border-color:var(--cyan); }

  .phrase { font-family:'JetBrains Mono',monospace; font-size:12.5px; background:rgba(0,0,0,.45); border:1px solid var(--border); border-radius:10px; padding:14px; color:var(--amber); word-spacing:6px; line-height:1.9; margin:10px 0; user-select:all; }
  .warn { font-size:11px; color:var(--amber); margin-top:10px; line-height:1.65; opacity:.85; }
  .copyrow { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .addr { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--green); word-break:break-all; flex:1; user-select:all; }
  .mini { padding:8px 14px; font-size:10.5px; background:transparent; border:1px solid var(--border-lit); border-radius:8px; color:var(--dim); cursor:pointer; letter-spacing:1px; text-transform:uppercase; font-family:'Inter',sans-serif; transition:.15s; }
  .mini:hover { border-color:var(--cyan); color:var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="big">B<b>I</b>G</div><div class="chain">Chain · Faucet</div></div>
  <div style="text-align:center"><span class="livebadge"><span class="livedot"></span>Live Network</span></div>
  <p class="tagline">The standalone ledger — claim your $BIG</p>

  <div class="stats">
    <div class="stat"><div class="v" id="supply">—</div><div class="k">Supply</div></div>
    <div class="stat"><div class="v" id="slot">—</div><div class="k">Slot</div></div>
  </div>

  <div class="card">
    <h2>Faucet</h2>
    <input type="text" id="addr" placeholder="Paste your BIG / Solana address" autocomplete="off" spellcheck="false">
    <button class="btn" id="claim" onclick="claim()">Claim 100 $BIG</button>
    <div class="msg" id="msg"></div>
    <p class="warn" id="rules" style="display:none;color:var(--dim)">5-minute cooldown per address · bonus 1 SOL for fees · works with any standard Solana wallet (Phantom, Solflare, Backpack)</p>
  </div>

  <div class="card">
    <h2>No Wallet Yet</h2>
    <button class="btn ghost" id="create" onclick="createWallet()">Create a BIG custodial wallet</button>
    <div class="msg" id="wmsg"></div>
  </div>

  <div class="foot">
    <a href="/scan">BIGscan</a><a href="/stats">Stats</a>
  </div>
</div>

<script>
fetch('/stats').then(r=>r.json()).then(s=>{
  document.getElementById('supply').textContent = (s.supply/1e6).toFixed(1)+'M';
  document.getElementById('slot').textContent = '#'+s.slot;
}).catch(()=>{});
document.getElementById('rules').style.display='block';

function el(id){ return document.getElementById(id); }
function show(id, ok, html){ const m=el(id); m.className='msg '+(ok?'ok':'err'); m.innerHTML=html; }

async function claim(){
  const addr = el('addr').value.trim();
  const b = el('claim');
  if(!addr){ show('msg', false, 'Paste an address first.'); return; }
  b.disabled = true; b.textContent = 'Claiming…';
  try{
    const r = await fetch('/drip', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({address:addr})});
    const d = await r.json();
    if(d.ok){
      show('msg', true, '✅ <b>'+d.amount+' $BIG</b> claimed + 1 SOL for fees.<br><a href="/scan?tx='+d.sig+'">View on BIGscan →</a>');
    } else { show('msg', false, '⚠️ '+(d.error||'Claim failed.')); }
  }catch(e){ show('msg', false, 'Network error — try again.'); }
  b.disabled = false; b.textContent = 'Claim 100 $BIG';
}

async function createWallet(){
  const b = el('create');
  b.disabled = true; b.textContent = 'Creating…';
  try{
    const r = await fetch('/wallet/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const d = await r.json();
    if(d.ok){
      show('wmsg', true, '✅ Wallet created.<div class="copyrow"><span class="addr" id="newaddr">'+d.address+'</span></div>'+
        '<div class="phrase" id="newphrase">'+d.phrase+'</div>'+
        '<p class="warn">⚠️ Write this 12-word phrase down and keep it private — it\'s the ONLY way to import this wallet into Phantom/Solflare. Keys are held on the BIG ledger.</p>'+
        '<div class="copyrow"><button class="mini" onclick="copyTxt(\'newphrase\')">Copy phrase</button><button class="mini" onclick="copyTxt(\'newaddr\')">Copy address</button></div>');
      el('addr').value = d.address;
    } else { show('wmsg', false, '⚠️ '+(d.error||'Creation failed.')); }
  }catch(e){ show('wmsg', false, 'Network error — try again.'); }
  b.disabled = false; b.textContent = 'Create a BIG custodial wallet';
}

function copyTxt(id){ const t=document.getElementById(id).textContent; navigator.clipboard.writeText(t).then(()=>{}); }
</script>
</body>
</html>
