<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIG Chain — Faucet</title>
<style>
  :root{
    --bg0:#040910; --bg1:#060f1a; --panel:#071522; --panel2:#0a1c2c;
    --border:#0f3d52; --border-lit:#1a6b8c;
    --cyan:#4be8ff; --cyan-dim:#2c9cb8; --cyan-glow:rgba(75,232,255,.55);
    --green:#5cf59a; --amber:#ffcf5c; --red:#ff6b6b; --ink:#c9edf5; --dim:#5e8a9a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { min-height:100vh; }
  body {
    background:
      radial-gradient(1100px 620px at 50% -8%, rgba(20,80,110,.35) 0%, rgba(4,9,16,0) 60%),
      repeating-linear-gradient(0deg, rgba(75,232,255,.028) 0px, rgba(75,232,255,.028) 1px, transparent 1px, transparent 3px),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    color:var(--ink); font-family:'Consolas','SF Mono','Courier New',monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px;
    letter-spacing:.2px;
  }
  .wrap { width:100%; max-width:480px; }
  .logo { text-align:center; margin-bottom:4px; position:relative; }
  .logo .big { font-size:40px; font-weight:800; color:var(--cyan); letter-spacing:3px; text-shadow:0 0 18px var(--cyan-glow), 0 0 2px var(--cyan); text-transform:uppercase; }
  .logo .chain { font-size:13px; color:var(--dim); letter-spacing:6px; text-transform:uppercase; margin-top:2px; }
  .livebadge { display:inline-flex; align-items:center; gap:6px; margin:12px auto 0; padding:4px 12px; border:1px solid var(--border-lit); border-radius:2px; color:var(--green); font-size:10px; letter-spacing:2px; text-transform:uppercase; background:rgba(92,245,154,.06); }
  .livedot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .tagline { text-align:center; color:var(--dim); font-size:12px; margin:16px 0 26px; letter-spacing:1px; text-transform:uppercase; }

  .card { position:relative; background:linear-gradient(180deg, var(--panel2), var(--panel)); border:1px solid var(--border); padding:22px 20px; margin-bottom:16px; clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); }
  .card::before, .card::after { content:''; position:absolute; width:14px; height:14px; border:1px solid var(--cyan-dim); opacity:.7; }
  .card::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .card h2 { font-size:12px; color:var(--cyan); text-transform:uppercase; letter-spacing:2.5px; margin-bottom:16px; font-weight:700; text-shadow:0 0 10px var(--cyan-glow); display:flex; align-items:center; gap:8px; }
  .card h2::before { content:'//'; color:var(--cyan-dim); font-weight:400; }

  input[type=text] { width:100%; padding:13px 14px; background:var(--bg0); border:1px solid var(--border); color:var(--ink); font-size:13px; font-family:inherit; outline:none; transition:border-color .15s, box-shadow .15s; }
  input[type=text]::placeholder { color:#3d5c68; }
  input[type=text]:focus { border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan-dim), 0 0 14px var(--cyan-glow); }

  .btn { width:100%; margin-top:12px; padding:13px; background:transparent; border:1px solid var(--cyan); color:var(--cyan); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .15s; font-family:inherit; }
  .btn:hover:not(:disabled) { background:var(--cyan); color:#04121a; box-shadow:0 0 20px var(--cyan-glow); }
  .btn:disabled { opacity:.4; cursor:wait; }
  .btn.ghost { border:1px dashed var(--border-lit); color:var(--dim); }
  .btn.ghost:hover { border-color:var(--cyan); color:var(--cyan); background:transparent; box-shadow:0 0 14px var(--cyan-glow); }

  .msg { margin-top:14px; padding:13px 14px; border-radius:0; font-size:12.5px; line-height:1.6; word-break:break-all; display:none; border-left:2px solid; }
  .msg.ok { display:block; background:rgba(92,245,154,.06); border-color:var(--green); color:var(--green); }
  .msg.err { display:block; background:rgba(255,107,107,.06); border-color:var(--red); color:var(--red); }
  .msg a { color:var(--cyan); text-decoration:none; border-bottom:1px dashed var(--cyan); }

  .stats { display:flex; gap:10px; margin-bottom:16px; }
  .stat { flex:1; background:var(--panel); border:1px solid var(--border); padding:13px; text-align:center; }
  .stat .v { font-size:17px; font-weight:700; color:var(--cyan); text-shadow:0 0 8px var(--cyan-glow); }
  .stat .k { font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:4px; }

  .foot { text-align:center; margin-top:22px; }
  .foot a { color:var(--dim); font-size:12px; text-decoration:none; margin:0 10px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid transparent; }
  .foot a:hover { color:var(--cyan); border-color:var(--cyan); }

  .phrase { font-family:inherit; font-size:12.5px; background:var(--bg0); border:1px solid var(--border); padding:12px; color:var(--amber); word-spacing:6px; line-height:1.8; margin:8px 0; user-select:all; }
  .warn { font-size:11px; color:var(--amber); margin-top:8px; line-height:1.6; opacity:.85; }
  .copyrow { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .addr { font-family:inherit; font-size:11.5px; color:var(--green); word-break:break-all; flex:1; user-select:all; }
  .mini { padding:6px 12px; font-size:10.5px; background:transparent; border:1px solid var(--border-lit); color:var(--dim); cursor:pointer; letter-spacing:1px; text-transform:uppercase; font-family:inherit; }
  .mini:hover { border-color:var(--cyan); color:var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="big">BIG</div><div class="chain">Chain // Faucet</div></div>
  <div style="text-align:center"><span class="livebadge"><span class="livedot"></span>Live Network</span></div>
  <p class="tagline">// The standalone ledger — claim your $BIG</p>

  <div class="stats">
    <div class="stat"><div class="v" id="supply">—</div><div class="k">Supply</div></div>
    <div class="stat"><div class="v" id="slot">—</div><div class="k">Slot</div></div>
  </div>

  <div class="card">
    <h2>Faucet</h2>
    <input type="text" id="addr" placeholder="Paste your BIG / Solana address" autocomplete="off" spellcheck="false">
    <button class="btn" id="claim" onclick="claim()">Claim 100 $BIG</button>
    <div class="msg" id="msg"></div>
    <p class="warn" id="rules" style="display:none;color:var(--dim)">5-minute cooldown per address · bonus 1 SOL for fees · works with any standard Solana wallet (Phantom, Solflare, Backpack)</p>
  </div>

  <div class="card">
    <h2>No Wallet Yet</h2>
    <button class="btn ghost" id="create" onclick="createWallet()">Create a BIG custodial wallet</button>
    <div class="msg" id="wmsg"></div>
  </div>

  <div class="foot">
    <a href="/scan">BIGscan</a><a href="/stats">Stats</a>
  </div>
</div>

<script>
fetch('/stats').then(r=>r.json()).then(s=>{
  document.getElementById('supply').textContent = (s.supply/1e6).toFixed(1)+'M';
  document.getElementById('slot').textContent = '#'+s.slot;
}).catch(()=>{});
document.getElementById('rules').style.display='block';

function el(id){ return document.getElementById(id); }
function show(id, ok, html){ const m=el(id); m.className='msg '+(ok?'ok':'err'); m.innerHTML=html; }

async function claim(){
  const addr = el('addr').value.trim();
  const b = el('claim');
  if(!addr){ show('msg', false, 'Paste an address first.'); return; }
  b.disabled = true; b.textContent = 'Claiming…';
  try{
    const r = await fetch('/drip', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({address:addr})});
    const d = await r.json();
    if(d.ok){
      show('msg', true, '✅ <b>'+d.amount+' $BIG</b> claimed + 1 SOL for fees.<br><a href="/scan?tx='+d.sig+'">View on BIGscan →</a>');
    } else { show('msg', false, '⚠️ '+(d.error||'Claim failed.')); }
  }catch(e){ show('msg', false, 'Network error — try again.'); }
  b.disabled = false; b.textContent = 'Claim 100 $BIG';
}

async function createWallet(){
  const b = el('create');
  b.disabled = true; b.textContent = 'Creating…';
  try{
    const r = await fetch('/wallet/create', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const d = await r.json();
    if(d.ok){
      show('wmsg', true, '✅ Wallet created.<div class="copyrow"><span class="addr" id="newaddr">'+d.address+'</span></div>'+
        '<div class="phrase" id="newphrase">'+d.phrase+'</div>'+
        '<p class="warn">⚠️ Write this 12-word phrase down and keep it private — it\'s the ONLY way to import this wallet into Phantom/Solflare. Keys are held on the BIG ledger.</p>'+
        '<div class="copyrow"><button class="mini" onclick="copyTxt(\'newphrase\')">Copy phrase</button><button class="mini" onclick="copyTxt(\'newaddr\')">Copy address</button></div>');
      el('addr').value = d.address;
    } else { show('wmsg', false, '⚠️ '+(d.error||'Creation failed.')); }
  }catch(e){ show('wmsg', false, 'Network error — try again.'); }
  b.disabled = false; b.textContent = 'Create a BIG custodial wallet';
}

function copyTxt(id){ const t=document.getElementById(id).textContent; navigator.clipboard.writeText(t).then(()=>{}); }
</script>
</body>
</html>
