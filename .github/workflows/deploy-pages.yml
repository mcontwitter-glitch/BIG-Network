name: Deploy BIG Network site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'index.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (brand landing at root + gateway app pages)
        run: |
          mkdir -p site
          cp public/* site/
          cp public/index.html site/faucet.html
          cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
